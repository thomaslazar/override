<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Override</title>
<meta name="description" content="Ad-free match-3 with endless levels. No ads, no accounts.">
<meta property="og:type" content="website">
<meta property="og:title" content="Override">
<meta property="og:description" content="Jack in, line them up, crack the lock before the patrol comes back. Ad-free match-3 with endless levels. No ads, no accounts.">
<meta property="og:url" content="https://thomaslazar.github.io/override/">
<meta property="og:image" content="https://thomaslazar.github.io/override/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Override">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preload" href="fonts/barlow-semi-condensed-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/share-tech-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="src/ui.js"></script>
</head>
<body>
<section id="strip" aria-hidden="true"></section>
<div id="comms"><span class="who" id="who"></span><span id="line"></span></div>
<div id="deckwrap">
<main id="deck">
  <img class="plug" src="art/plug.webp" alt=""><img class="key kl" src="art/key-l.webp" alt=""><img class="key kr" src="art/key-r.webp" alt="">
  <div id="screen">
    <div id="log"><div><span id="deckName"></span> <span id="levelLabel"></span></div><div id="log2"></div><div id="log3"></div></div>
    <div id="hud"><div id="goals"></div><div id="patrol"><small id="patrolLabel"></small><b id="moves"></b></div></div>
    <div id="wrap"><canvas id="board"></canvas></div>
    <div id="soft"><button class="soft" id="menuBtn"></button><span id="wip"></span></div>
  </div>
  <img class="sticker" src="art/sticker-eye.webp" alt="" style="left:50%;top:-38px;height:30px;transform:translateX(-50%) rotate(-3deg)">
  <img class="sticker" src="art/sticker-skull.webp" alt="" style="left:44px;top:calc(100% + 3px);height:27px;transform:rotate(-14deg)">
  <img class="sticker" src="art/sticker-voidwalk.webp" alt="" style="left:110px;top:calc(100% + 5px);height:25px;transform:rotate(5deg)">
  <img class="sticker" src="art/sticker-42.webp" alt="" style="right:60px;top:calc(100% + 4px);height:26px;transform:rotate(11deg)">
</main>
</div>
<div id="toast" role="status"></div>
<div id="alert" role="alert" hidden></div>
<div id="loading"><b id="loadTitle"></b><span id="loadSub"></span></div>
<div id="sheet"><div id="card"></div></div>
<div id="menu" hidden></div>
<div id="turn"><span id="turnText"></span></div>
</body>
</html>
